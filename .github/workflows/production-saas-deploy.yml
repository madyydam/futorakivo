name: Production Cloud SaaS CI/CD & Deploy

on:
  push:
    branches: [master, main]
    paths:
      - "apps/**"
      - "packages/**"
      - "docker-compose.saas-cloud.yml"
      - ".github/workflows/production-saas-deploy.yml"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Lint, Typecheck & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Types Workspace Package
        run: pnpm --filter @futora/types build

      - name: Generate Prisma Client
        run: pnpm --filter @futora/backend exec prisma generate

      - name: Backend Typecheck
        run: pnpm --filter @futora/backend run typecheck

      - name: Web Typecheck
        run: pnpm --filter web run typecheck

      - name: Run Web Test Suite
        run: pnpm --filter web test

  build-and-publish:
    name: Build & Push SaaS Cloud Containers
    needs: validate-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kivo-backend:latest
            ghcr.io/${{ github.repository_owner }}/kivo-backend:${{ github.sha }}

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kivo-web:latest
            ghcr.io/${{ github.repository_owner }}/kivo-web:${{ github.sha }}
